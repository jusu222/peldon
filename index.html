<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Me perdonas?</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff5f9e,#ff8cc8,#ffd3e8,#ffeaf3);
background-size:400% 400%;
animation:fondo 12s ease infinite;
}

@keyframes fondo{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
text-align:center;
position:relative;
z-index:2;
padding:20px;
}

h1{
font-size:clamp(55px,9vw,120px);
color:white;
text-shadow:0 0 10px #fff,
0 0 20px #ff69b4,
0 0 40px #ff1493;
animation:aparecer 1.5s ease;
}

p{
margin-top:20px;
font-size:25px;
color:white;
animation:fade 2s;
}

.botones{
margin-top:45px;
position:relative;
height:120px;
}

button{
padding:16px 38px;
font-size:22px;
border:none;
border-radius:50px;
cursor:pointer;
transition:.3s;
position:absolute;
}

#si{
left:calc(50% - 150px);
background:#ff2d75;
color:white;
box-shadow:0 10px 25px rgba(255,0,100,.35);
}

#si:hover{
transform:scale(1.12);
}

#no{
left:calc(50% + 20px);
background:white;
color:#ff2d75;
}

@keyframes aparecer{
0%{
transform:scale(.2);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.corazon{
position:absolute;
bottom:-50px;
font-size:25px;
animation:subir linear infinite;
opacity:.8;
}

@keyframes subir{
0%{
transform:translateY(0) scale(.6);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-110vh) scale(1.4);
opacity:0;
}
}

#mensaje{
margin-top:35px;
font-size:32px;
font-weight:bold;
color:white;
text-shadow:0 0 15px hotpink;
display:none;
animation:fade .8s;
}
</style>

</head>
<body>

<div id="corazones"></div>

<div class="container">

<h1>¿Me perdonas? 🥺❤️</h1>

<p>
Prometo hacerlo mejor.<br>
Solo quiero otra oportunidad.
</p>

<div class="botones">

<button id="si">Sí ❤️</button>

<button id="no">Todavía no 😅</button>

</div>

<div id="mensaje">
¡¡Sabía que sí!! ❤️🥹✨
</div>

</div>

<script>

const contenedor=document.getElementById("corazones");

function crearCorazon(){

const c=document.createElement("div");

c.className="corazon";

c.innerHTML=["❤️","💖","💕","💗","💞"][Math.floor(Math.random()*5)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(4+Math.random()*5)+"s";

c.style.fontSize=(20+Math.random()*30)+"px";

contenedor.appendChild(c);

setTimeout(()=>c.remove(),9000);

}

setInterval(crearCorazon,250);

const no=document.getElementById("no");

no.addEventListener("mouseover",()=>{

const x=Math.random()*(window.innerWidth-140);

const y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";

});

document.getElementById("si").onclick=function(){

document.getElementById("mensaje").style.display="block";

document.body.style.background=
"linear-gradient(135deg,#ff4f9a,#ff85c0,#ffd7ea)";

};

</script>

</body>
</html>
